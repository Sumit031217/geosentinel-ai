version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_USER: geosentinel
      POSTGRES_PASSWORD: securepassword
      POSTGRES_DB: geosentinel_db
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://geosentinel:securepassword@db/geosentinel_db
    volumes:
      - ./backend:/app
      - ./ml_engine:/ml_engine # Share ML models with backend

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  celery_worker:
    build: ./backend
    command: celery -A core.celery_app.celery worker --loglevel=info
    depends_on:
      - redis
      - db
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgresql://geosentinel:securepassword@db/geosentinel_db
    volumes:
      - ./backend:/app
      - ./ml_engine:/ml_engine      

volumes:
  postgis_data: